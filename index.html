<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do You Love Me?</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #fff;
        }

        .page {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            width: 90%;
            text-align: center;
            animation: appear 0.8s ease;
        }

        /* KARAKTER */
        .character {
            position: relative;
            width: 230px;
            height: 190px;
            margin: 0 auto 15px;
        }

        .bear {
            position: absolute;
            left: 25px;
            bottom: 10px;
            width: 125px;
            height: 125px;
            background: #f3b47c;
            border-radius: 48% 48% 45% 45%;
            z-index: 2;
        }

        .bear::before,
        .bear::after {
            content: "";
            position: absolute;
            top: -15px;
            width: 35px;
            height: 35px;
            background: #f3b47c;
            border-radius: 50%;
        }

        .bear::before {
            left: 8px;
        }

        .bear::after {
            right: 8px;
        }

        .bear-eye {
            position: absolute;
            top: 48px;
            width: 7px;
            height: 9px;
            background: #333;
            border-radius: 50%;
        }

        .eye1 {
            left: 38px;
        }

        .eye2 {
            right: 38px;
        }

        .nose {
            position: absolute;
            top: 63px;
            left: 55px;
            width: 15px;
            height: 10px;
            background: #333;
            border-radius: 50%;
        }

        .mouth {
            position: absolute;
            top: 72px;
            left: 58px;
            width: 12px;
            height: 8px;
            border-bottom: 2px solid #333;
            border-radius: 50%;
        }

        /* Tangan */
        .hand {
            position: absolute;
            width: 42px;
            height: 25px;
            background: #f3b47c;
            border-radius: 50%;
            top: 70px;
            z-index: 4;
        }

        .hand.left {
            left: -18px;
            transform: rotate(25deg);
        }

        .hand.right {
            right: -18px;
            transform: rotate(-25deg);
        }

        /* Panda */
        .panda {
            position: absolute;
            right: 10px;
            bottom: 5px;
            width: 120px;
            height: 145px;
            background: white;
            border: 3px solid #333;
            border-radius: 50% 50% 45% 45%;
            z-index: 3;
        }

        .panda::before,
        .panda::after {
            content: "";
            position: absolute;
            top: -13px;
            width: 30px;
            height: 30px;
            background: #333;
            border-radius: 50%;
        }

        .panda::before {
            left: 5px;
        }

        .panda::after {
            right: 5px;
        }

        .panda-eye {
            position: absolute;
            top: 48px;
            width: 25px;
            height: 32px;
            background: #333;
            border-radius: 50%;
        }

        .panda-eye::after {
            content: "";
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            top: 7px;
            left: 7px;
        }

        .panda-eye.left {
            left: 18px;
            transform: rotate(30deg);
        }

        .panda-eye.right {
            right: 18px;
            transform: rotate(-30deg);
        }

        .panda-nose {
            position: absolute;
            top: 78px;
            left: 51px;
            width: 16px;
            height: 11px;
            background: #333;
            border-radius: 50%;
        }

        .speech {
            position: absolute;
            top: 0;
            right: 15px;
            background: white;
            border: 2px solid #555;
            border-radius: 50%;
            padding: 10px;
            font-size: 11px;
            font-weight: bold;
            z-index: 10;
        }

        .speech::after {
            content: "";
            position: absolute;
            bottom: -9px;
            left: 15px;
            border-width: 8px 8px 0 0;
            border-style: solid;
            border-color: #555 transparent transparent transparent;
        }

        /* PERTANYAAN */
        h1 {
            margin: 15px 0 25px;
            font-size: clamp(28px, 8vw, 42px);
            color: #222;
            font-weight: 700;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            position: relative;
            min-height: 55px;
        }

        button {
            border: none;
            border-radius: 30px;
            padding: 13px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #ff3b8d;
            box-shadow: 0 6px 18px rgba(255, 59, 141, 0.35);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #yes:hover {
            transform: scale(1.08);
        }

        #no {
            background: #ff8fba;
            position: relative;
            transition: left 0.25s ease, top 0.25s ease;
        }

        /* HALAMAN BERHASIL */
        .success {
            display: none;
            text-align: center;
            animation: successIn 0.8s ease;
        }

        .success h2 {
            font-size: clamp(30px, 9vw, 48px);
            color: #ff3b8d;
            margin: 15px 0;
        }

        .success p {
            font-size: 20px;
            color: #444;
        }

        .big-heart {
            font-size: 100px;
            animation: heartbeat 0.8s infinite;
        }

        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: floatUp linear forwards;
        }

        /* ANIMASI */
        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes successIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 400px) {
            .character {
                transform: scale(0.85);
                margin-bottom: 0;
            }

            h1 {
                margin-top: 0;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- HALAMAN PERTANYAAN -->
    <div class="container" id="questionPage">

        <div class="character">

            <div class="speech">
                Reply me
            </div>

            <!-- Bear -->
            <div class="bear">
                <div class="bear-eye eye1"></div>
                <div class="bear-eye eye2"></div>
                <div class="nose"></div>
                <div class="mouth"></div>

                <div class="hand left"></div>
                <div class="hand right"></div>
            </div>

            <!-- Panda -->
            <div class="panda">
                <div class="panda-eye left"></div>
                <div class="panda-eye right"></div>
                <div class="panda-nose"></div>
            </div>

        </div>

        <h1>Do you love me?</h1>

        <div class="buttons">

            <button id="yes">
                Yes
            </button>

            <button id="no">
                No
            </button>

        </div>

    </div>


    <!-- HALAMAN SUKSES -->
    <div class="success" id="successPage">

        <div class="big-heart">
            ❤️
        </div>

        <h2>I knew it! </h2>

        <p>
            I love you too ❤️
        </p>

        <button onclick="location.reload()">
            Replay
        </button>

    </div>

</div>

<!-- TEMPAT HATI -->
<div class="hearts" id="hearts"></div>


<script>

    const yesButton = document.getElementById("yes");
    const noButton = document.getElementById("no");

    const questionPage = document.getElementById("questionPage");
    const successPage = document.getElementById("successPage");

    /*
    ======================================
            TOMBOL YES
    ======================================
    */

    yesButton.addEventListener("click", function () {

        questionPage.style.display = "none";
        successPage.style.display = "block";

        createHearts();

    });


    /*
    ======================================
            TOMBOL NO
    ======================================
    */

    function moveNoButton() {

        const maxX = window.innerWidth - noButton.offsetWidth - 30;
        const maxY = window.innerHeight - noButton.offsetHeight - 30;

        const randomX = Math.max(
            10,
            Math.random() * maxX
        );

        const randomY = Math.max(
            10,
            Math.random() * maxY
        );

        noButton.style.position = "fixed";
        noButton.style.left = randomX + "px";
        noButton.style.top = randomY + "px";
    }


    // Android / Touch
    noButton.addEventListener("touchstart", function (event) {

        event.preventDefault();

        moveNoButton();

    });


    // PC / Mouse
    noButton.addEventListener("mouseenter", function () {

        moveNoButton();

    });


    /*
    ======================================
            ANIMASI HATI
    ======================================
    */

    function createHearts() {

        const heartContainer =
            document.getElementById("hearts");

        for (let i = 0; i < 35; i++) {

            const heart =
                document.createElement("div");

            heart.className = "heart";

            heart.innerHTML =
                ["❤️", "💕", "💗", "💖", "💓"]
                [Math.floor(Math.random() * 5)];

            heart.style.left =
                Math.random() * 100 + "%";

            heart.style.fontSize =
                (18 + Math.random() * 30) + "px";

            heart.style.animationDuration =
                (3 + Math.random() * 4) + "s";

            heart.style.animationDelay =
                Math.random() * 2 + "s";

            heartContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }
    }

</script>

</body>
</html>
